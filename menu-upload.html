<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Menu — OrderTaker</title>
<link rel="icon" href="icons/ot-icon-96.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0A0303;color:#FFF5F5;font-family:-apple-system,sans-serif;line-height:1.6;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 48px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,3,3,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,107,53,0.15)}
.wrap{max-width:700px;margin:0 auto;padding:100px 24px 80px}
h1{font-size:36px;font-weight:900;letter-spacing:-1.5px;margin-bottom:10px}
.card{background:#1A0707;border:1px solid rgba(255,107,53,0.15);border-radius:14px;padding:28px;margin-bottom:20px}
.label{font-size:12px;font-weight:700;letter-spacing:.5px;color:#9A7575;margin-bottom:8px;display:block}
.field{width:100%;padding:10px 14px;background:#130505;border:1px solid rgba(255,107,53,0.15);border-radius:8px;color:#FFF5F5;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;margin-bottom:14px}
.field:focus{border-color:#FF6B35}
textarea.field{resize:vertical;min-height:80px}
.btn{padding:12px 24px;background:#FF6B35;color:#1a0000;font-size:14px;font-weight:800;border-radius:9px;border:none;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.88}
.btn-outline{background:transparent;color:#9A7575;border:1px solid rgba(255,107,53,0.15)}
.btn-outline:hover{border-color:#FF6B35;color:#FF6B35}
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,107,53,0.06)}
.item-row:last-child{border-bottom:none}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,107,53,0.1);color:#FF6B35;border:1px solid rgba(255,107,53,0.2)}
.success{background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);border-radius:10px;padding:16px;color:#4ADE80;font-size:14px;font-weight:600;display:none;margin-top:16px}
footer{text-align:center;padding:24px;border-top:1px solid rgba(255,107,53,0.15);font-size:13px;color:#9A7575;display:flex;justify-content:center;gap:24px}
footer a{color:#9A7575;text-decoration:none}
</style>
</head>
<body>
<nav>
<a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
<img src="icons/ot-icon-96.png" style="width:36px;height:36px;border-radius:8px">
<span style="font-size:20px;font-weight:800"><span style="color:#FFF5F5">Order</span><span style="color:#FF6B35">Taker</span></span>
</a>
<a href="dashboard.html" style="color:#9A7575;text-decoration:none;font-size:14px">Dashboard</a>
</nav>
<div class="wrap">
<span style="font-size:11px;font-weight:700;letter-spacing:2px;color:#FF6B35;text-transform:uppercase;display:block;margin-bottom:14px">Menu Setup</span>
<h1>Upload Your Menu</h1>
<p style="font-size:16px;color:#9A7575;margin-bottom:36px">Add your menu items so your AI agent can take accurate orders.</p>

<div class="card">
<span class="label">RESTAURANT</span>
<select class="field" id="restaurant-select"><option value="">Loading restaurants...</option></select>
</div>

<div class="card">
<span class="label">ADD ITEM</span>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><span class="label">Item Name *</span><input class="field" id="item-name" type="text" placeholder="e.g. Margherita Pizza"></div>
<div><span class="label">Price *</span><input class="field" id="item-price" type="number" step="0.01" placeholder="12.99"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><span class="label">Category</span>
<select class="field" id="item-cat">
<option>Starters</option><option>Mains</option><option>Pizza</option><option>Burgers</option>
<option>Pasta</option><option>Salads</option><option>Sides</option><option>Desserts</option>
<option>Drinks</option><option>Specials</option>
</select></div>
<div><span class="label">Description (optional)</span><input class="field" id="item-desc" type="text" placeholder="Brief description"></div>
</div>
<button class="btn" onclick="addItem()">+ Add to List</button>
</div>

<div class="card" id="preview-card" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<span style="font-size:14px;font-weight:700">Menu Preview (<span id="item-count">0</span> items)</span>
<button class="btn btn-outline" onclick="clearAll()">Clear All</button>
</div>
<div id="item-list"></div>
<button class="btn" onclick="saveMenu()" style="margin-top:20px;width:100%">Save Menu to AI Agent</button>
<div class="success" id="save-success">✓ Menu saved! Your AI agent now knows your full menu.</div>
</div>
</div>
<footer>
<a href="index.html">Home</a>
<a href="dashboard.html">Dashboard</a>
<a href="onboarding.html">Setup Checklist</a>
</footer>
<script>
const SB_URL="https://hvyfeebazmiqateniupm.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2eWZlZWJhem1pcWF0ZW5pdXBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMTI2MTcsImV4cCI6MjA5NTY4ODYxN30.89qqEshOwp1bU2AQbzSpZ36_TuqP2jVULo_9Ug-S9_c";
const sb=supabase.createClient(SB_URL,SB_KEY);
let items=[];

async function loadRestaurants(){
  const{data}=await sb.from("ot_restaurants").select("id,name").order("name");
  const sel=document.getElementById("restaurant-select");
  if(!data||!data.length){sel.innerHTML='<option value="">No restaurants found</option>';return;}
  sel.innerHTML=data.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
}

function addItem(){
  const name=document.getElementById("item-name").value.trim();
  const price=parseFloat(document.getElementById("item-price").value);
  if(!name||isNaN(price)){alert("Name and price are required.");return;}
  const cat=document.getElementById("item-cat").value;
  const desc=document.getElementById("item-desc").value.trim();
  items.push({name,price,category:cat,description:desc});
  document.getElementById("item-name").value="";
  document.getElementById("item-price").value="";
  document.getElementById("item-desc").value="";
  renderItems();
}

function renderItems(){
  document.getElementById("preview-card").style.display=items.length?"block":"none";
  document.getElementById("item-count").textContent=items.length;
  document.getElementById("item-list").innerHTML=items.map((it,i)=>`
    <div class="item-row">
      <span style="font-size:14px;color:#FFF5F5;font-weight:600">${it.name}</span>
      <span class="tag">${it.category}</span>
      <span style="color:#FF6B35;font-weight:700">$${it.price.toFixed(2)}</span>
      <button onclick="removeItem(${i})" style="background:none;border:none;color:#9A7575;cursor:pointer;font-size:16px">✕</button>
    </div>`).join("");
}

function removeItem(i){items.splice(i,1);renderItems();}
function clearAll(){items=[];renderItems();}

async function saveMenu(){
  const restId=document.getElementById("restaurant-select").value;
  if(!restId){alert("Please select a restaurant.");return;}
  if(!items.length){alert("Please add at least one item.");return;}
  const btn=event.target;btn.disabled=true;btn.textContent="Saving...";
  const rows=items.map(it=>({restaurant_id:restId,name:it.name,price:it.price,category:it.category,description:it.description||null}));
  const{error}=await sb.from("ot_menu_items").upsert(rows,{onConflict:"restaurant_id,name"});
  btn.disabled=false;btn.textContent="Save Menu to AI Agent";
  if(error){alert("Save failed: "+error.message);return;}
  document.getElementById("save-success").style.display="block";
  items=[];renderItems();
}

loadRestaurants();
</script>
</body>
</html>
